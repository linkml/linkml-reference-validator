name: Publish Python Package

on:
  workflow_dispatch:
  # `published`, not `created`: GitHub runs no workflow while a release is a
  # draft, and publishing a draft later sends `published`, not `created`, so
  # a `created` trigger never fires for a release that began as a draft.
  # Each release sends `published` once, so this does not publish twice.
  release:
    types: [published]

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build source and wheel archives
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true